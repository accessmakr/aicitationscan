[build]
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[functions."*"]
included_files = [
  "engine/**"
]

# ---------------------------
# SECURITY HEADERS
# ---------------------------

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------
# API REDIRECTS
# ---------------------------

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# ---------------------------
# CLEAN PROGRAMMATIC ROUTES
# ---------------------------

[[redirects]]
from = "/programmatic/website-tech-stack-checker"
to = "/programmatic/website-tech-stack-checker.html"
status = 200

# ---------------------------
# CLEAN TOOL URLS
# ---------------------------

[[redirects]]
from = "/*"
to = "/:splat.html"
status = 200
force = false
