name: Auto-Generate SEO Assets

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'

# Required to solve the 403 Forbidden error
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate SEO Assets
        run: node scripts/build-seo-assets.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml js/registry.js js/pages.json
          
          # Only commit if there are actual changes to prevent workflow loops
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update SEO assets [skip ci]"
            git push
          fi
