name: Auto-Generate SEO Assets

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate Assets
        run: node scripts/build-seo-assets.js

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml js/registry.js js/pages.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update SEO assets [skip ci]"
          git push
