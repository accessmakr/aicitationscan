<body>
  <h1>Website Tech Stack Checker</h1>

  <input
    type="text"
    id="urlInput"
    placeholder="Enter website URL"
  />

  <button onclick="scanWebsite()">
    Analyze Website
  </button>

  <pre id="results"></pre>

  <script type="module">
    import {
      analyzeTechnology
    } from "/engine/intelligence-engine.js";

    async function loadJSON(path) {
      const response =
        await fetch(path);

      return response.json();
    }

    window.scanWebsite =
      async function () {
        const url =
          document.getElementById(
            "urlInput"
          ).value;

        const response =
          await fetch(
            `/.netlify/functions/fetch-site?url=${encodeURIComponent(
              url
            )}`
          );

        const data =
          await response.json();

        const cms =
          await loadJSON(
            "/data/cms-signatures.json"
          );

        const frameworks =
          await loadJSON(
            "/data/framework-signatures.json"
          );

        const ai =
          await loadJSON(
            "/data/ai-signatures.json"
          );

        const marketing =
          await loadJSON(
            "/data/marketing-signatures.json"
          );

        const cdn =
          await loadJSON(
            "/data/cdn-signatures.json"
          );

        const results = {
          cms:
            await analyzeTechnology(
              data,
              cms
            ),

          frameworks:
            await analyzeTechnology(
              data,
              frameworks
            ),

          ai:
            await analyzeTechnology(
              data,
              ai
            ),

          marketing:
            await analyzeTechnology(
              data,
              marketing
            ),

          cdn:
            await analyzeTechnology(
              data,
              cdn
            )
        };

        document.getElementById(
          "results"
        ).textContent =
          JSON.stringify(
            results,
            null,
            2
          );
      };
  </script>
</body>
