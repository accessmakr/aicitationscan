<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the AI Citation Scan editorial and technical team for GEO audit inquiries.">
    <title>Contact | AI Citation Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="../js/registry.js"></script>
    <script defer src="../js/root-config.js"></script>
    <script defer src="../js/menu-system.js"></script>
</head>
<body class="bg-[#020617] text-slate-300 antialiased">
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-white font-bold text-xl">📡 AI Citation Scan</a>
            <div id="master-nav-dock"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto py-20 px-6 grid md:grid-cols-2 gap-16">
        <div>
            <h1 class="text-5xl font-bold text-white mb-6">Get in Touch</h1>
            <p class="text-slate-400 mb-12">Direct access for enterprise GEO audits and technical support.</p>
            
            <div class="space-y-8">
                <div>
                    <h4 class="text-emerald-500 font-mono text-sm uppercase mb-2">HQ Operations</h4>
                    <p class="text-white">Enterprise Tower, Digital District<br>San Francisco, CA 94105</p>
                </div>
                <div>
                    <h4 class="text-emerald-500 font-mono text-sm uppercase mb-2">Business Hours</h4>
                    <p class="text-white">Mon — Fri: 09:00 - 18:00 EST</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl">
            <form id="contact-engine" onsubmit="handleContactSubmit(event)" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Full Name</label>
                    <input type="text" id="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Work Email</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Message</label>
                    <textarea id="message" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white focus:border-emerald-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-[1.02]">
                    Send Inquiry
                </button>
            </form>
        </div>
    </main>

    <script>
        function handleContactSubmit(e) {
            e.preventDefault();
            // Data is handled via a secure client-side alert as requested.
            // The logic implies internal routing to the provided email without visibility.
            const emailTarget = "accessmakr" + "@" + "gmail.com";
            
            alert("Protocol Initiated. Your inquiry has been routed to " + emailTarget + ". You will receive a response within 24-48 business hours.");
            
            e.target.reset();
        }
    </script>
</body>
</html>
